# A tag (v4.1.0-kiln.1, ...) on main: build and check as ci.yml does, then
# commit the built tree to the release branch (what Kiln OS's
# INSTALL_PLUGIN clones and Fluidd's update manager pulls) and attach a zip
# of it to a GitHub release, for installing by hand.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Happy Hare and Klipper
        run: |
          . ./happy-hare.version
          git clone -q --depth 1 --branch "$HH_REF" "$HH_REPO" hh
          git init -q klipper
          git -C klipper fetch -q --depth 1 "$KLIPPER_REPO" "$KLIPPER_REF"
          git -C klipper checkout -q FETCH_HEAD
      - name: Happy Hare tests
        run: make -C hh test ALL=1
      - name: Build
        run: VERSION="$GITHUB_REF_NAME" tools/build.sh out hh
      - name: Check
        run: python3 tools/check.py out klipper
      - name: Commit to the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch -q origin release
            git worktree add -q rel origin/release
          else
            git worktree add -q --detach rel
            git -C rel checkout -q --orphan release
          fi
          git -C rel rm -rfq --ignore-unmatch .
          cp -a out/. rel/
          git -C rel add -A
          git -C rel commit -q -m "happy-hare $GITHUB_REF_NAME" -m "$(cat out/BUILD)"
          git -C rel push -q origin HEAD:refs/heads/release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && zip -qr "../happy-hare-$GITHUB_REF_NAME.zip" .)
          gh release create "$GITHUB_REF_NAME" "happy-hare-$GITHUB_REF_NAME.zip" \
            --title "happy-hare $GITHUB_REF_NAME" --notes-file out/BUILD
