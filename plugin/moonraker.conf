# Keeps the plugin up to date from Fluidd (Moonraker's update manager).
# The release branch is built from the main branch by the repository's
# release workflow: Happy Hare's code plus the AD5X IFS configuration.
[update_manager happy-hare]
type: git_repo
path: /data/ad5x/plugins/happy-hare
origin: https://github.com/KilnOS-Plugins/kiln-happy-hare.git
primary_branch: release
is_system_service: False
managed_services: klipper
